
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-v1
  template:
    metadata:
      labels:
        app: shopping-v1
    spec:
      containers:
        - name: shopping-app
          image: dharunpb/shoppingapp:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shopping-v1-service
spec:
  type: NodePort
  selector:
    app: shopping-v1
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
---
