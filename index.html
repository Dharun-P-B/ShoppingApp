
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping App - v3</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
      background: #f4f6f8;
    }
    h1, h2 { text-align: center; }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }
    .product, .cart {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0001;
    }
    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 6px;
      background: #1769aa;
      color: white;
      cursor: pointer;
    }
    .price { font-weight: bold; }
    .cart { margin-top: 25px; }
  </style>
</head>
<body>
  <h1>Shopping App - v3</h1>
  <p>Register Number: 24MIS0200</p>

  <h2>Available Products</h2>
  <div class="products" id="products"></div>

  <section class="cart">
    <h2>Shopping Cart</h2>
    <p>Items in cart: <strong id="count">0</strong></p>
    <ul id="cartItems"></ul>
    <p>Total: <strong id="total">₹0</strong></p>
  </section>

  <script>
    const products = [
      { id: 1, name: "Laptop", price: 55000 },
      { id: 2, name: "Headphones", price: 1500 },
      { id: 3, name: "Keyboard", price: 900 },
      { id: 4, name: "Mouse", price: 500 }
    ];

    const cart = [];

    function money(amount) {
      return "₹" + amount.toLocaleString("en-IN");
    }

    function showProducts() {
      document.getElementById("products").innerHTML =
        products.map(product => `
          <article class="product">
            <h3>${product.name}</h3>
            <p class="price">${money(product.price)}</p>
            <button onclick="addToCart(${product.id})">
              Add to Cart
            </button>
          </article>
        `).join("");
    }

    function addToCart(id) {
      const product = products.find(item => item.id === id);
      if (product) {
        cart.push(product);
        showCart();
      }
    }

    
function removeFromCart(index) {
  cart.splice(index, 1);
  showCart();
}

function showCart() {
  document.getElementById("count").textContent = cart.length;

  document.getElementById("cartItems").innerHTML =
    cart.map((item, index) => `
      <li>
        ${item.name} — ${money(item.price)}
        <button onclick="removeFromCart(${index})">
          Remove
        </button>
      </li>
    `).join("");

  const total = cart.reduce((sum, item) => sum + item.price, 0);
  document.getElementById("total").textContent = money(total);
}


    showProducts();
    showCart();
  </script>
</body>
</html>
